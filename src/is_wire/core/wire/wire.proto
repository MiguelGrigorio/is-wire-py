syntax = "proto3";

package is.wire;

option java_package = "com.is.wire";
option java_multiple_files = true;

import "google/protobuf/any.proto";

// Códigos que indicam falha ou sucesso de uma RPC
enum StatusCode {
  UNKNOWN = 0;  
  OK = 1;
  CANCELLED = 2;
  INVALID_ARGUMENT = 3;
  DEADLINE_EXCEEDED = 4;
  NOT_FOUND = 5;
  ALREADY_EXISTS = 6;
  PERMISSION_DENIED = 7;
  UNAUTHENTICATED = 8;
  FAILED_PRECONDITION = 9;
  OUT_OF_RANGE = 10;
  UNIMPLEMENTED = 11;
  INTERNAL_ERROR = 12;
}

message Status {
  StatusCode code = 1;
  string why = 2; // Mensagem legível explicando o erro
}

enum ContentType {
  NONE = 0;
  PROTOBUF = 1;
  JSON = 2;
  PROTOTEXT = 3;
}

message WireFormat {
  oneof body {
    bytes raw = 1;
    google.protobuf.Any message = 2;
  }
  // Instante em que a mensagem foi criada
  uint64 created_at = 3;
  //
  ContentType content_type = 4;
  // 
  Status status = 5;
  // 
  uint64 correlation_id = 6;
  // Para onde o resultado do processamento desta mensagem deve ser enviado
  string reply_to = 7;
  //
  uint32 expires_in = 8;
}
