name: Main

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      rabbitmq:
        image: rabbitmq:4.3.1@sha256:6a46d2aef889d2a8cc28ac91b4a1ca0116a4a151de10cada219ee7685dc01c5b
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev,tracing]'
      - run: pytest --cov=is_wire
      - run: ruff check src tests

  protobuf-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        protobuf: ["protobuf>=5.29,<6", "protobuf>=6,<7", "protobuf>=7,<8"]
    services:
      rabbitmq:
        image: rabbitmq:4.3.1@sha256:6a46d2aef889d2a8cc28ac91b4a1ca0116a4a151de10cada219ee7685dc01c5b
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' '${{ matrix.protobuf }}'
      - run: pytest

  minimum-dependencies:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.3.1@sha256:6a46d2aef889d2a8cc28ac91b4a1ca0116a4a151de10cada219ee7685dc01c5b
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install -e '.[dev]'
          amqp==5.3.1
          protobuf==5.29.1
          colorlog==6.12.0
          prometheus-client==0.26.0
          opentelemetry-api==1.44.0
          opentelemetry-propagator-b3==1.44.0
      - run: pytest

  broker-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rabbitmq:
          - rabbitmq:3.7.6@sha256:9d404822c74463abecc30637a6de64bf086fa2f222b13ba51759cbe328a3ccab
          - rabbitmq:3.13.7@sha256:87178a0ee3e2f52980ba356d38646ed1056705ff2d5ff281f8965456eaa0c1e3
          - rabbitmq:4.3.1@sha256:6a46d2aef889d2a8cc28ac91b4a1ca0116a4a151de10cada219ee7685dc01c5b
    services:
      rabbitmq:
        image: ${{ matrix.rabbitmq }}
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: pytest

  optional-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [is-msgs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - if: matrix.target == 'is-msgs'
        run: python -m pip install '.[dev]' 'protobuf>=5.29,<6'
      - if: matrix.target == 'is-msgs'
        run: python -m pip install --no-deps is-msgs==1.1.18
      - if: matrix.target == 'is-msgs'
        run: pytest tests/unit/core/test_is_msgs.py

  build:
    needs:
      - test
      - protobuf-compatibility
      - minimum-dependencies
      - broker-compatibility
      - optional-compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build --sdist --wheel --outdir dist/ .
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: is-wire-sea-distributions
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: is-wire-sea-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
